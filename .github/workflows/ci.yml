name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint (zero violations)
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Tests + coverage (>=85%)
        run: uv run pytest

      - name: File-size cap (<=150 non-blank/comment lines per src file)
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            n=$(grep -vcE '^[[:space:]]*(#.*)?$' "$f")
            if [ "$n" -gt 150 ]; then echo "TOO LONG ($n): $f"; fail=1; fi
          done < <(find src -name '*.py')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All source files within the 150-line cap."
